name: Apply Better OS alarm and mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-border-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Alarm and Mirror apps
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          about_card = '   <button class="app-card" onclick="openOSApp(\'about\')"><div class="app-icon">i</div><strong>About OS</strong><span>How it works</span></button>'
          extra_cards = '   <button class="app-card" onclick="openOSApp(\'alarm\')"><div class="app-icon">⏰</div><strong>Alarm</strong><span>Time & custom sound</span></button>\n   <button class="app-card" onclick="openOSApp(\'mirror\')"><div class="app-icon">◉</div><strong>Mirror</strong><span>Use your camera</span></button>\n'
          if "openOSApp('alarm')" not in s:
              if about_card not in s:
                  raise SystemExit('About app card marker not found')
              s = s.replace(about_card, extra_cards + about_card, 1)

          about_panel = ' <div class="os-app" id="os-app-about">'
          extra_panels = ' <div class="os-app" id="os-app-alarm"><div class="os-app-header"><button class="os-nav-btn" onclick="closeOSApp()">←</button><h2 class="title">Alarm</h2></div><div class="os-panel-card"><label class="field-label">Alarm time</label><input id="alarm-time" class="ledger-input" type="time" onchange="saveAlarmTime(this.value)"><div class="setting-row" style="margin-top:12px"><div class="setting-copy"><strong>Alarm enabled</strong><div class="hint">Uses this device\'s local time</div></div><label class="switch"><input id="alarm-toggle" type="checkbox" onchange="setAlarmEnabled(this.checked)"><span class="switch-slider"></span></label></div><div class="hint" id="alarm-status" style="margin-top:9px">No alarm set.</div></div><div class="os-panel-card"><label class="field-label">Alarm sound</label><p class="hint">Use the built-in tone, choose an audio file, or record your own sound with the microphone.</p><div class="alarm-actions"><div class="file-btn-wrap btn btn-outline btn-sm">Choose sound<input id="alarm-file-input" type="file" accept="audio/*" onchange="importAlarmSound(event)"></div><button class="btn btn-primary btn-sm" id="alarm-record-btn" onclick="toggleAlarmRecording()">● Record with mic</button><button class="btn btn-outline btn-sm" onclick="previewAlarmSound()">▶ Test sound</button><button class="btn btn-outline btn-sm" onclick="clearAlarmSound()">Use default</button></div><div class="alarm-sound-name" id="alarm-sound-name">Built-in alarm tone</div><div class="toast" id="alarm-toast"></div><p class="hint" style="margin-top:10px">For a reliable alarm, keep this site open. Browsers can pause or stop pages after a tab is closed or the device sleeps.</p></div></div>\n <div class="os-app" id="os-app-mirror"><div class="os-app-header"><button class="os-nav-btn" onclick="closeOSApp()">←</button><h2 class="title">Mirror</h2></div><div class="mirror-stage"><video id="mirror-video" autoplay muted playsinline></video><div class="mirror-placeholder" id="mirror-placeholder"><strong>Camera is off</strong><span>Allow camera access to use Mirror.</span></div></div><div class="mirror-actions"><button class="btn btn-primary" onclick="startMirror()">Start camera</button><button class="btn btn-outline" onclick="stopMirror()">Stop camera</button></div><div class="toast" id="mirror-toast"></div><p class="hint">The camera stream stops automatically when you leave Mirror.</p></div>\n'
          if 'id="os-app-alarm"' not in s:
              if about_panel not in s:
                  raise SystemExit('About app panel marker not found')
              s = s.replace(about_panel, extra_panels + about_panel, 1)

          loader_marker = '<div class="os-loader" id="os-loader" aria-live="polite">'
          ring_overlay = '<div class="alarm-overlay" id="alarm-overlay" aria-hidden="true"><div class="alarm-ring-box"><div class="alarm-bell">⏰</div><span class="eyebrow">Better OS Alarm</span><h2 id="alarm-ring-time">Alarm</h2><p id="alarm-ring-label">Your alarm is ringing.</p><div class="alarm-ring-actions"><button class="btn btn-primary" onclick="dismissAlarm()">Stop alarm</button><button class="btn btn-outline" onclick="snoozeAlarm()">Snooze 5 min</button></div></div></div>\n'
          if 'id="alarm-overlay"' not in s:
              if loader_marker not in s:
                  raise SystemExit('OS loader marker not found')
              s = s.replace(loader_marker, ring_overlay + loader_marker, 1)

          css_marker = '.storage-meter div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}'
          extra_css = '.alarm-actions,.mirror-actions,.alarm-ring-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.alarm-sound-name{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);font:700 11px var(--mono);color:var(--accent)}#alarm-record-btn.recording{background:linear-gradient(145deg,#e76666,#a92e2e);border-color:#7b2020;box-shadow:0 5px 0 #6d1d1d}.mirror-stage{position:relative;width:100%;aspect-ratio:4/5;max-height:470px;overflow:hidden;border:2px solid var(--line);border-radius:20px;background:#050706;box-shadow:0 7px 0 color-mix(in srgb,var(--line) 60%,#181818),0 16px 28px rgba(0,0,0,.18)}.mirror-stage video{width:100%;height:100%;display:none;object-fit:cover;transform:scaleX(-1)}.mirror-stage.active video{display:block}.mirror-placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:7px;color:#e8eee9;padding:25px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 22%,#07100c),#050706 72%)}.mirror-placeholder strong{font:700 24px var(--display)}.mirror-placeholder span{font-size:12px;color:#aab7b0}.mirror-stage.active .mirror-placeholder{display:none}.alarm-overlay{position:fixed;inset:0;z-index:260;display:none;place-items:center;padding:24px;background:rgba(4,10,7,.8);backdrop-filter:blur(12px)}.alarm-overlay.show{display:grid}.alarm-ring-box{width:min(430px,92vw);padding:30px;text-align:center;color:var(--text);border:2px solid color-mix(in srgb,var(--accent) 60%,white);border-radius:28px;background:linear-gradient(145deg,var(--paper2),var(--paper));box-shadow:0 18px 0 var(--accentDark),0 38px 70px rgba(0,0,0,.45),inset 0 2px rgba(255,255,255,.8);animation:alarmPop .42s cubic-bezier(.2,.9,.2,1)}.alarm-bell{font-size:64px;animation:alarmShake .75s ease-in-out infinite}.alarm-ring-box h2{font:700 42px var(--mono);margin:13px 0 6px;color:var(--accent)}.alarm-ring-box p{color:var(--muted);margin:0}.alarm-ring-actions{justify-content:center;margin-top:22px}@keyframes alarmPop{from{opacity:0;transform:scale(.82) translateY(18px)}to{opacity:1;transform:none}}@keyframes alarmShake{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}'
          if '.mirror-stage{' not in s:
              if css_marker not in s:
                  raise SystemExit('Storage CSS marker not found')
              s = s.replace(css_marker, css_marker + extra_css, 1)

          old_defaults = "function defaults(){return{balance:0,currency:'USD',wishes:[],darkMode:false,textColor:null,accentColor:null,theme:'ledger',wallpaperPalette:null,depth:7,motion:'normal',compact:false,bgDim:58,glassBlur:2,performanceMode:false,decorativeGlow:true,progressShimmer:true,highContrast:false,bgMotion:true,betterOS:false,confirmPurchases:true,hidePurchased:false,affordableFirst:false,showProgressText:true,showRemaining:true,background:{type:'none',data:null,mime:null}}}"
          new_defaults = "function defaults(){return{balance:0,currency:'USD',wishes:[],darkMode:false,textColor:null,accentColor:null,theme:'ledger',wallpaperPalette:null,depth:7,motion:'normal',compact:false,bgDim:58,glassBlur:2,performanceMode:false,decorativeGlow:true,progressShimmer:true,highContrast:false,bgMotion:true,betterOS:false,confirmPurchases:true,hidePurchased:false,affordableFirst:false,showProgressText:true,showRemaining:true,alarmTime:'',alarmEnabled:false,alarmSnoozeUntil:0,alarmLastKey:'',background:{type:'none',data:null,mime:null}}}"
          if old_defaults in s:
              s = s.replace(old_defaults, new_defaults, 1)
          elif "alarmTime:''" not in s:
              raise SystemExit('Defaults marker not found')

          old_vars = "let state=loadState(),pendingPictureData=null,currentPage='home',navLocked=false,osDb=null,musicUrls=[],osClockTimer=null,wikiOnline=null,tapGame={running:false,score:0,end:0},guessTarget=Math.floor(Math.random()*20)+1;"
          new_vars = "let state=loadState(),pendingPictureData=null,currentPage='home',navLocked=false,osDb=null,musicUrls=[],osClockTimer=null,wikiOnline=null,tapGame={running:false,score:0,end:0},guessTarget=Math.floor(Math.random()*20)+1,alarmTimer=null,alarmRinging=false,alarmAudio=null,alarmAudioUrl=null,alarmToneCtx=null,alarmToneTimer=null,alarmRecorder=null,alarmRecordStream=null,alarmChunks=[],mirrorStream=null;"
          if old_vars in s:
              s = s.replace(old_vars, new_vars, 1)
          elif 'alarmTimer=null' not in s:
              raise SystemExit('Runtime variable marker not found')

          old_db = "function openMusicDB(){if(osDb)return Promise.resolve(osDb);return new Promise((resolve,reject)=>{const req=indexedDB.open('WishLedgerBetterOS',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('music'))db.createObjectStore('music',{keyPath:'id'})};req.onsuccess=()=>{osDb=req.result;resolve(osDb)};req.onerror=()=>reject(req.error)})}"
          new_db = "function openMusicDB(){if(osDb)return Promise.resolve(osDb);return new Promise((resolve,reject)=>{const req=indexedDB.open('WishLedgerBetterOS',2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('music'))db.createObjectStore('music',{keyPath:'id'});if(!db.objectStoreNames.contains('alarm'))db.createObjectStore('alarm',{keyPath:'id'})};req.onsuccess=()=>{osDb=req.result;resolve(osDb)};req.onerror=()=>reject(req.error)})}"
          if old_db in s:
              s = s.replace(old_db, new_db, 1)
          elif "objectStoreNames.contains('alarm')" not in s:
              raise SystemExit('IndexedDB marker not found')

          old_open = "function openOSApp(name){document.getElementById('os-dashboard').style.display='none';document.querySelectorAll('.os-app').forEach(x=>x.classList.remove('active'));const p=document.getElementById('os-app-'+name);if(p)p.classList.add('active');if(name==='music')renderMusicLibrary();if(name==='notes')document.getElementById('os-notes').value=localStorage.getItem(NOTES_KEY)||'';if(name==='tools')checkStorage()}"
          new_open = "function openOSApp(name){if(name!=='mirror')stopMirror();if(name!=='alarm')stopAlarmRecording();document.getElementById('os-dashboard').style.display='none';document.querySelectorAll('.os-app').forEach(x=>x.classList.remove('active'));const p=document.getElementById('os-app-'+name);if(p)p.classList.add('active');if(name==='music')renderMusicLibrary();if(name==='notes')document.getElementById('os-notes').value=localStorage.getItem(NOTES_KEY)||'';if(name==='tools')checkStorage();if(name==='alarm')refreshAlarmUI();if(name==='mirror')setTimeout(startMirror,40)}"
          if old_open in s:
              s = s.replace(old_open, new_open, 1)
          elif "if(name==='mirror')" not in s:
              raise SystemExit('openOSApp marker not found')

          old_close = "function closeOSApp(showDash=true){document.querySelectorAll('.os-app').forEach(x=>x.classList.remove('active'));if(showDash)document.getElementById('os-dashboard').style.display='block';else document.getElementById('os-dashboard').style.display='block'}"
          new_close = "function closeOSApp(showDash=true){stopMirror();stopAlarmRecording();document.querySelectorAll('.os-app').forEach(x=>x.classList.remove('active'));if(showDash)document.getElementById('os-dashboard').style.display='block';else document.getElementById('os-dashboard').style.display='block'}"
          if old_close in s:
              s = s.replace(old_close, new_close, 1)
          elif 'function closeOSApp(showDash=true){stopMirror();' not in s:
              raise SystemExit('closeOSApp marker not found')

          import_marker = 'async function importMusic(e){'
          helpers = """function alarmStore(mode,work){return openMusicDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('alarm',mode),store=tx.objectStore('alarm');let req;try{req=work(store)}catch(e){reject(e);return}if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}else{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)}}))}
async function saveAlarmBlob(blob,name){await alarmStore('readwrite',store=>store.put({id:'current',blob,name:name||'Custom alarm',type:blob.type||'audio/webm',saved:Date.now()}));await refreshAlarmUI()}
async function getAlarmBlob(){try{return await alarmStore('readonly',store=>store.get('current'))}catch{return null}}
async function clearAlarmSound(){try{await alarmStore('readwrite',store=>store.delete('current'));toast('alarm-toast','Using the built-in alarm tone.');await refreshAlarmUI()}catch{toast('alarm-toast','Could not clear the custom sound.',true)}}
function saveAlarmTime(v){state.alarmTime=v;state.alarmSnoozeUntil=0;state.alarmLastKey='';saveState();refreshAlarmUI();startAlarmWatcher()}
function setAlarmEnabled(v){if(v&&!state.alarmTime){const t=document.getElementById('alarm-toggle');if(t)t.checked=false;return toast('alarm-toast','Choose an alarm time first.',true)}state.alarmEnabled=v;state.alarmSnoozeUntil=0;state.alarmLastKey='';saveState();unlockAlarmAudio();refreshAlarmUI();startAlarmWatcher()}
async function refreshAlarmUI(){const ti=document.getElementById('alarm-time'),tg=document.getElementById('alarm-toggle'),st=document.getElementById('alarm-status'),sn=document.getElementById('alarm-sound-name');if(ti)ti.value=state.alarmTime||'';if(tg)tg.checked=!!state.alarmEnabled;if(st){if(state.alarmSnoozeUntil>Date.now())st.textContent='Snoozed until '+new Date(state.alarmSnoozeUntil).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});else if(state.alarmEnabled&&state.alarmTime)st.textContent='Alarm set for '+state.alarmTime+' • keep this site open';else st.textContent=state.alarmTime?'Alarm is off.':'No alarm set.'}if(sn){const row=await getAlarmBlob();sn.textContent=row?'Custom: '+row.name:'Built-in alarm tone'}}
async function importAlarmSound(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('audio/'))return toast('alarm-toast','Choose an audio file.',true);try{await saveAlarmBlob(f,f.name);toast('alarm-toast','Custom alarm sound saved.')}catch{toast('alarm-toast','Could not save that sound in browser storage.',true)}e.target.value=''}
async function toggleAlarmRecording(){if(alarmRecorder&&alarmRecorder.state==='recording'){stopAlarmRecording();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('alarm-toast','Microphone recording is not supported in this browser.',true);try{alarmRecordStream=await navigator.mediaDevices.getUserMedia({audio:true});alarmChunks=[];alarmRecorder=new MediaRecorder(alarmRecordStream);const btn=document.getElementById('alarm-record-btn');if(btn){btn.classList.add('recording');btn.textContent='■ Stop recording'}alarmRecorder.ondataavailable=e=>{if(e.data&&e.data.size)alarmChunks.push(e.data)};alarmRecorder.onstop=async()=>{const type=alarmRecorder?.mimeType||'audio/webm',blob=new Blob(alarmChunks,{type});alarmRecordStream?.getTracks().forEach(t=>t.stop());alarmRecordStream=null;const b=document.getElementById('alarm-record-btn');if(b){b.classList.remove('recording');b.textContent='● Record with mic'}if(blob.size){try{await saveAlarmBlob(blob,'Microphone recording');toast('alarm-toast','Recording saved as your alarm sound.')}catch{toast('alarm-toast','Could not save the recording.',true)}}alarmRecorder=null;alarmChunks=[]};alarmRecorder.start();toast('alarm-toast','Recording… tap Stop when finished.')}catch{toast('alarm-toast','Microphone permission was not granted.',true);stopAlarmRecording()}}
function stopAlarmRecording(){if(alarmRecorder&&alarmRecorder.state==='recording'){try{alarmRecorder.stop()}catch{}}else{alarmRecordStream?.getTracks().forEach(t=>t.stop());alarmRecordStream=null;const b=document.getElementById('alarm-record-btn');if(b){b.classList.remove('recording');b.textContent='● Record with mic'}}}
function unlockAlarmAudio(){try{if(!alarmToneCtx)alarmToneCtx=new(window.AudioContext||window.webkitAudioContext)();if(alarmToneCtx.state==='suspended')alarmToneCtx.resume().catch(()=>{})}catch{}}
function beepOnce(){try{unlockAlarmAudio();const c=alarmToneCtx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=760;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.32);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.34)}catch{}}
function startDefaultAlarmTone(){stopDefaultAlarmTone();beepOnce();alarmToneTimer=setInterval(beepOnce,900)}
function stopDefaultAlarmTone(){if(alarmToneTimer){clearInterval(alarmToneTimer);alarmToneTimer=null}}
async function playAlarmSound(){stopAlarmSound();const row=await getAlarmBlob();if(row&&row.blob){alarmAudioUrl=URL.createObjectURL(row.blob);alarmAudio=new Audio(alarmAudioUrl);alarmAudio.loop=true;alarmAudio.volume=1;try{await alarmAudio.play();return}catch{stopAlarmSound()}}startDefaultAlarmTone()}
function stopAlarmSound(){if(alarmAudio){try{alarmAudio.pause();alarmAudio.currentTime=0}catch{}alarmAudio=null}if(alarmAudioUrl){URL.revokeObjectURL(alarmAudioUrl);alarmAudioUrl=null}stopDefaultAlarmTone()}
async function previewAlarmSound(){unlockAlarmAudio();toast('alarm-toast','Playing alarm preview…');await playAlarmSound();setTimeout(()=>{if(!alarmRinging)stopAlarmSound()},3500)}
function currentAlarmKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'|'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function startAlarmWatcher(){if(alarmTimer)clearInterval(alarmTimer);alarmTimer=setInterval(checkAlarm,1000);checkAlarm()}
function checkAlarm(){if(alarmRinging||!state.alarmEnabled)return;const now=Date.now();if(state.alarmSnoozeUntil&&now>=state.alarmSnoozeUntil){state.alarmSnoozeUntil=0;saveState();ringAlarm('Snoozed alarm');return}if(!state.alarmTime)return;const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),key=currentAlarmKey();if(hm===state.alarmTime&&state.alarmLastKey!==key){state.alarmLastKey=key;saveState();ringAlarm('Alarm for '+state.alarmTime)}}
async function ringAlarm(label){alarmRinging=true;const o=document.getElementById('alarm-overlay');if(o){o.classList.add('show');o.setAttribute('aria-hidden','false')}const t=document.getElementById('alarm-ring-time'),l=document.getElementById('alarm-ring-label');if(t)t.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(l)l.textContent=label||'Your alarm is ringing.';await playAlarmSound()}
function dismissAlarm(){alarmRinging=false;state.alarmSnoozeUntil=0;saveState();stopAlarmSound();const o=document.getElementById('alarm-overlay');if(o){o.classList.remove('show');o.setAttribute('aria-hidden','true')}refreshAlarmUI()}
function snoozeAlarm(){alarmRinging=false;state.alarmSnoozeUntil=Date.now()+5*60*1000;saveState();stopAlarmSound();const o=document.getElementById('alarm-overlay');if(o){o.classList.remove('show');o.setAttribute('aria-hidden','true')}refreshAlarmUI()}
async function startMirror(){if(mirrorStream)return;if(!navigator.mediaDevices?.getUserMedia)return toast('mirror-toast','Camera access is not supported in this browser.',true);try{mirrorStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.getElementById('mirror-video'),stage=v?.closest('.mirror-stage');if(v){v.srcObject=mirrorStream;await v.play().catch(()=>{})}stage?.classList.add('active');toast('mirror-toast','Camera on.')}catch{mirrorStream=null;toast('mirror-toast','Camera permission was not granted.',true)}}
function stopMirror(){if(mirrorStream){mirrorStream.getTracks().forEach(t=>t.stop());mirrorStream=null}const v=document.getElementById('mirror-video');if(v)v.srcObject=null;v?.closest('.mirror-stage')?.classList.remove('active')}
"""
          if 'function alarmStore(' not in s:
              if import_marker not in s:
                  raise SystemExit('importMusic marker not found')
              s = s.replace(import_marker, helpers + import_marker, 1)

          old_loader = "async function openBetterOS(){if(!state.betterOS)return;const loader=document.getElementById('os-loader');loader.classList.add('show');const total=5;let done=0;setLoader(done,total,'Loading fonts…');try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch{}setLoader(++done,total,'Opening local database…');try{await openMusicDB()}catch(e){setLoader(done,total,'Local database could not open',true)}setLoader(++done,total,'Loading your music library…');try{await renderMusicLibrary()}catch{}setLoader(++done,total,'Loading notes…');document.getElementById('os-notes').value=localStorage.getItem(NOTES_KEY)||'';setLoader(++done,total,'Checking Wikipedia connection…');await warmWikipedia();setLoader(++done,total,'Ready');renderOSDashboard();goTo('os');loader.classList.remove('show')}"
          new_loader = "async function openBetterOS(){if(!state.betterOS)return;const loader=document.getElementById('os-loader');loader.classList.add('show');const total=6;let done=0;setLoader(done,total,'Loading fonts…');try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch{}setLoader(++done,total,'Opening local database…');try{await openMusicDB()}catch(e){setLoader(done,total,'Local database could not open',true)}setLoader(++done,total,'Loading your music library…');try{await renderMusicLibrary()}catch{}setLoader(++done,total,'Loading alarm…');try{await refreshAlarmUI()}catch{}setLoader(++done,total,'Loading notes…');document.getElementById('os-notes').value=localStorage.getItem(NOTES_KEY)||'';setLoader(++done,total,'Checking Wikipedia connection…');await warmWikipedia();setLoader(++done,total,'Ready');renderOSDashboard();goTo('os');loader.classList.remove('show')}"
          if old_loader in s:
              s = s.replace(old_loader, new_loader, 1)

          startup = "applyAppearance();applyBackground();renderHome();"
          if startup in s and 'renderHome();startAlarmWatcher();' not in s:
              s = s.replace(startup, "applyAppearance();applyBackground();renderHome();startAlarmWatcher();", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Better OS Alarm and Mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Better OS alarm and camera mirror"
          git push
