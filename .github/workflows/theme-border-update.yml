name: Apply Better OS alarm and mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-border-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Better OS Alarm and Mirror module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'const ALARM_CFG_KEY=' in s:
              print('Alarm/Mirror module already installed')
              raise SystemExit(0)

          addon = r'''<script>
          (()=>{
          const ALARM_CFG_KEY='wishLedgerAlarmCfg_v1';
          let alarmCfg={time:'',enabled:false,snoozeUntil:0,lastKey:''};
          try{alarmCfg={...alarmCfg,...JSON.parse(localStorage.getItem(ALARM_CFG_KEY)||'{}')}}catch{}
          let alarmTimer=null,alarmRinging=false,alarmAudio=null,alarmAudioUrl=null,alarmToneCtx=null,alarmToneTimer=null;
          let alarmRecorder=null,alarmRecordStream=null,alarmChunks=[],alarmRecordShouldSave=true,mirrorStream=null;
          const saveAlarmCfg=()=>{try{localStorage.setItem(ALARM_CFG_KEY,JSON.stringify(alarmCfg))}catch{}};

          const style=document.createElement('style');
          style.textContent=`
          .alarm-actions,.mirror-actions,.alarm-ring-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
          .alarm-sound-name{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);font:700 11px var(--mono);color:var(--accent)}
          #alarm-record-btn.recording{background:linear-gradient(145deg,#e76666,#a92e2e);border-color:#7b2020;box-shadow:0 5px 0 #6d1d1d}
          .mirror-stage{position:relative;width:100%;aspect-ratio:4/5;max-height:470px;overflow:hidden;border:2px solid var(--line);border-radius:20px;background:#050706;box-shadow:0 7px 0 color-mix(in srgb,var(--line) 60%,#181818),0 16px 28px rgba(0,0,0,.18)}
          .mirror-stage video{width:100%;height:100%;display:none;object-fit:cover;transform:scaleX(-1)}.mirror-stage.active video{display:block}
          .mirror-placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:7px;color:#e8eee9;padding:25px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 22%,#07100c),#050706 72%)}
          .mirror-placeholder strong{font:700 24px var(--display)}.mirror-placeholder span{font-size:12px;color:#aab7b0}.mirror-stage.active .mirror-placeholder{display:none}
          .alarm-overlay{position:fixed;inset:0;z-index:260;display:none;place-items:center;padding:24px;background:rgba(4,10,7,.82);backdrop-filter:blur(12px)}.alarm-overlay.show{display:grid}
          .alarm-ring-box{width:min(430px,92vw);padding:30px;text-align:center;color:var(--text);border:2px solid color-mix(in srgb,var(--accent) 60%,white);border-radius:28px;background:linear-gradient(145deg,var(--paper2),var(--paper));box-shadow:0 18px 0 var(--accentDark),0 38px 70px rgba(0,0,0,.45),inset 0 2px rgba(255,255,255,.8);animation:alarmPop .42s cubic-bezier(.2,.9,.2,1)}
          .alarm-bell{font-size:64px;animation:alarmShake .75s ease-in-out infinite}.alarm-ring-box h2{font:700 42px var(--mono);margin:13px 0 6px;color:var(--accent)}.alarm-ring-box p{color:var(--muted);margin:0}.alarm-ring-actions{justify-content:center;margin-top:22px}
          @keyframes alarmPop{from{opacity:0;transform:scale(.82) translateY(18px)}to{opacity:1;transform:none}}@keyframes alarmShake{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}
          body.performance .alarm-overlay{backdrop-filter:none!important}body.motion-off .alarm-ring-box,body.motion-off .alarm-bell{animation:none!important}`;
          document.head.appendChild(style);

          const grid=document.querySelector('#page-os .app-grid');
          if(grid&&!document.getElementById('os-addon-alarm-card'))grid.insertAdjacentHTML('beforeend',`<button class="app-card" id="os-addon-alarm-card" onclick="openOSApp('alarm')"><div class="app-icon">⏰</div><strong>Alarm</strong><span>Time & custom sound</span></button><button class="app-card" id="os-addon-mirror-card" onclick="openOSApp('mirror')"><div class="app-icon">◉</div><strong>Mirror</strong><span>Use your camera</span></button>`);

          const osPage=document.getElementById('page-os');
          if(osPage&&!document.getElementById('os-app-alarm'))osPage.insertAdjacentHTML('beforeend',`
          <div class="os-app" id="os-app-alarm"><div class="os-app-header"><button class="os-nav-btn" onclick="closeOSApp()">←</button><h2 class="title">Alarm</h2></div><div class="os-panel-card"><label class="field-label">Alarm time</label><input id="alarm-time" class="ledger-input" type="time" onchange="saveAlarmTime(this.value)"><div class="setting-row" style="margin-top:12px"><div class="setting-copy"><strong>Alarm enabled</strong><div class="hint">Uses this device's local time</div></div><label class="switch"><input id="alarm-toggle" type="checkbox" onchange="setAlarmEnabled(this.checked)"><span class="switch-slider"></span></label></div><div class="hint" id="alarm-status" style="margin-top:9px">No alarm set.</div></div><div class="os-panel-card"><label class="field-label">Alarm sound</label><p class="hint">Use the built-in tone, choose an audio file, or record your own sound with the microphone.</p><div class="alarm-actions"><div class="file-btn-wrap btn btn-outline btn-sm">Choose sound<input id="alarm-file-input" type="file" accept="audio/*" onchange="importAlarmSound(event)"></div><button class="btn btn-primary btn-sm" id="alarm-record-btn" onclick="toggleAlarmRecording()">● Record with mic</button><button class="btn btn-outline btn-sm" onclick="previewAlarmSound()">▶ Test sound</button><button class="btn btn-outline btn-sm" onclick="clearAlarmSound()">Use default</button></div><div class="alarm-sound-name" id="alarm-sound-name">Built-in alarm tone</div><div class="toast" id="alarm-toast"></div><p class="hint" style="margin-top:10px">For a reliable alarm, keep this site open. Browsers can pause or stop pages after a tab is closed or the device sleeps.</p></div></div>
          <div class="os-app" id="os-app-mirror"><div class="os-app-header"><button class="os-nav-btn" onclick="closeOSApp()">←</button><h2 class="title">Mirror</h2></div><div class="mirror-stage"><video id="mirror-video" autoplay muted playsinline></video><div class="mirror-placeholder"><strong>Camera is off</strong><span>Allow camera access to use Mirror.</span></div></div><div class="mirror-actions"><button class="btn btn-primary" onclick="startMirror()">Start camera</button><button class="btn btn-outline" onclick="stopMirror()">Stop camera</button></div><div class="toast" id="mirror-toast"></div><p class="hint">The camera stream stops automatically when you leave Mirror.</p></div>`);

          if(!document.getElementById('alarm-overlay'))document.body.insertAdjacentHTML('beforeend',`<div class="alarm-overlay" id="alarm-overlay" aria-hidden="true"><div class="alarm-ring-box"><div class="alarm-bell">⏰</div><span class="eyebrow">Better OS Alarm</span><h2 id="alarm-ring-time">Alarm</h2><p id="alarm-ring-label">Your alarm is ringing.</p><div class="alarm-ring-actions"><button class="btn btn-primary" onclick="dismissAlarm()">Stop alarm</button><button class="btn btn-outline" onclick="snoozeAlarm()">Snooze 5 min</button></div></div></div>`);

          function openAlarmDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('WishLedgerAlarmDB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('sound'))r.result.createObjectStore('sound',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
          async function getAlarmBlob(){try{const db=await openAlarmDB();return await new Promise((resolve,reject)=>{const q=db.transaction('sound','readonly').objectStore('sound').get('current');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}catch{return null}}
          async function saveAlarmBlob(blob,name){const db=await openAlarmDB();await new Promise((resolve,reject)=>{const tx=db.transaction('sound','readwrite');tx.objectStore('sound').put({id:'current',blob,name:name||'Custom alarm',saved:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});refreshAlarmUI()}
          async function clearAlarmSound(){try{const db=await openAlarmDB();await new Promise((resolve,reject)=>{const tx=db.transaction('sound','readwrite');tx.objectStore('sound').delete('current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});toast('alarm-toast','Using the built-in alarm tone.');refreshAlarmUI()}catch{toast('alarm-toast','Could not clear the custom sound.',true)}}

          function saveAlarmTime(v){alarmCfg.time=v;alarmCfg.snoozeUntil=0;alarmCfg.lastKey='';saveAlarmCfg();refreshAlarmUI();startAlarmWatcher()}
          function setAlarmEnabled(v){if(v&&!alarmCfg.time){const t=document.getElementById('alarm-toggle');if(t)t.checked=false;return toast('alarm-toast','Choose an alarm time first.',true)}alarmCfg.enabled=v;alarmCfg.snoozeUntil=0;alarmCfg.lastKey='';saveAlarmCfg();unlockAlarmAudio();refreshAlarmUI();startAlarmWatcher()}
          async function refreshAlarmUI(){const ti=document.getElementById('alarm-time'),tg=document.getElementById('alarm-toggle'),st=document.getElementById('alarm-status'),sn=document.getElementById('alarm-sound-name');if(ti)ti.value=alarmCfg.time||'';if(tg)tg.checked=!!alarmCfg.enabled;if(st){if(alarmCfg.snoozeUntil>Date.now())st.textContent='Snoozed until '+new Date(alarmCfg.snoozeUntil).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});else if(alarmCfg.enabled&&alarmCfg.time)st.textContent='Alarm set for '+alarmCfg.time+' • keep this site open';else st.textContent=alarmCfg.time?'Alarm is off.':'No alarm set.'}if(sn){const row=await getAlarmBlob();sn.textContent=row?'Custom: '+row.name:'Built-in alarm tone'}}
          async function importAlarmSound(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('audio/'))return toast('alarm-toast','Choose an audio file.',true);try{await saveAlarmBlob(f,f.name);toast('alarm-toast','Custom alarm sound saved.')}catch{toast('alarm-toast','Could not save that sound.',true)}e.target.value=''}

          async function toggleAlarmRecording(){if(alarmRecorder&&alarmRecorder.state==='recording'){stopAlarmRecording(true);return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('alarm-toast','Microphone recording is not supported in this browser.',true);try{alarmRecordStream=await navigator.mediaDevices.getUserMedia({audio:true});alarmChunks=[];alarmRecordShouldSave=true;const rec=new MediaRecorder(alarmRecordStream);alarmRecorder=rec;const btn=document.getElementById('alarm-record-btn');if(btn){btn.classList.add('recording');btn.textContent='■ Stop recording'}rec.ondataavailable=e=>{if(e.data&&e.data.size)alarmChunks.push(e.data)};rec.onstop=async()=>{const blob=new Blob(alarmChunks,{type:rec.mimeType||'audio/webm'});alarmRecordStream?.getTracks().forEach(t=>t.stop());alarmRecordStream=null;const b=document.getElementById('alarm-record-btn');if(b){b.classList.remove('recording');b.textContent='● Record with mic'}if(alarmRecordShouldSave&&blob.size){try{await saveAlarmBlob(blob,'Microphone recording');toast('alarm-toast','Recording saved as your alarm sound.')}catch{toast('alarm-toast','Could not save the recording.',true)}}alarmRecorder=null;alarmChunks=[]};rec.start();toast('alarm-toast','Recording… tap Stop when finished.')}catch{toast('alarm-toast','Microphone permission was not granted.',true);stopAlarmRecording(false)}}
          function stopAlarmRecording(save=false){alarmRecordShouldSave=save;if(alarmRecorder&&alarmRecorder.state==='recording'){try{alarmRecorder.stop()}catch{}}else{alarmRecordStream?.getTracks().forEach(t=>t.stop());alarmRecordStream=null}}

          function unlockAlarmAudio(){try{if(!alarmToneCtx)alarmToneCtx=new(window.AudioContext||window.webkitAudioContext)();if(alarmToneCtx.state==='suspended')alarmToneCtx.resume().catch(()=>{})}catch{}}
          function beepOnce(){try{unlockAlarmAudio();const c=alarmToneCtx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=760;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.32);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.34)}catch{}}
          function startDefaultAlarmTone(){stopDefaultAlarmTone();beepOnce();alarmToneTimer=setInterval(beepOnce,900)}function stopDefaultAlarmTone(){if(alarmToneTimer){clearInterval(alarmToneTimer);alarmToneTimer=null}}
          function stopAlarmSound(){if(alarmAudio){try{alarmAudio.pause();alarmAudio.currentTime=0}catch{}alarmAudio=null}if(alarmAudioUrl){URL.revokeObjectURL(alarmAudioUrl);alarmAudioUrl=null}stopDefaultAlarmTone()}
          async function playAlarmSound(){stopAlarmSound();const row=await getAlarmBlob();if(row&&row.blob){alarmAudioUrl=URL.createObjectURL(row.blob);alarmAudio=new Audio(alarmAudioUrl);alarmAudio.loop=true;alarmAudio.volume=1;try{await alarmAudio.play();return}catch{stopAlarmSound()}}startDefaultAlarmTone()}
          async function previewAlarmSound(){unlockAlarmAudio();toast('alarm-toast','Playing alarm preview…');await playAlarmSound();setTimeout(()=>{if(!alarmRinging)stopAlarmSound()},3500)}

          function alarmKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'|'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
          function startAlarmWatcher(){if(alarmTimer)clearInterval(alarmTimer);alarmTimer=setInterval(checkAlarm,1000);checkAlarm()}
          function checkAlarm(){if(alarmRinging||!alarmCfg.enabled)return;const now=Date.now();if(alarmCfg.snoozeUntil&&now>=alarmCfg.snoozeUntil){alarmCfg.snoozeUntil=0;saveAlarmCfg();ringAlarm('Snoozed alarm');return}if(!alarmCfg.time)return;const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),key=alarmKey();if(hm===alarmCfg.time&&alarmCfg.lastKey!==key){alarmCfg.lastKey=key;saveAlarmCfg();ringAlarm('Alarm for '+alarmCfg.time)}}
          async function ringAlarm(label){alarmRinging=true;const o=document.getElementById('alarm-overlay');o?.classList.add('show');o?.setAttribute('aria-hidden','false');const t=document.getElementById('alarm-ring-time'),l=document.getElementById('alarm-ring-label');if(t)t.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(l)l.textContent=label||'Your alarm is ringing.';await playAlarmSound()}
          function dismissAlarm(){alarmRinging=false;alarmCfg.snoozeUntil=0;saveAlarmCfg();stopAlarmSound();const o=document.getElementById('alarm-overlay');o?.classList.remove('show');o?.setAttribute('aria-hidden','true');refreshAlarmUI()}
          function snoozeAlarm(){alarmRinging=false;alarmCfg.snoozeUntil=Date.now()+300000;saveAlarmCfg();stopAlarmSound();const o=document.getElementById('alarm-overlay');o?.classList.remove('show');o?.setAttribute('aria-hidden','true');refreshAlarmUI()}

          async function startMirror(){if(mirrorStream)return;if(!navigator.mediaDevices?.getUserMedia)return toast('mirror-toast','Camera is not supported in this browser.',true);try{mirrorStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.getElementById('mirror-video');if(v){v.srcObject=mirrorStream;await v.play().catch(()=>{});v.closest('.mirror-stage')?.classList.add('active')}toast('mirror-toast','Camera on.')}catch{mirrorStream=null;toast('mirror-toast','Camera permission was not granted.',true)}}
          function stopMirror(){if(mirrorStream){mirrorStream.getTracks().forEach(t=>t.stop());mirrorStream=null}const v=document.getElementById('mirror-video');if(v){v.srcObject=null;v.closest('.mirror-stage')?.classList.remove('active')}}

          const baseOpenOSApp=openOSApp,baseCloseOSApp=closeOSApp;
          openOSApp=function(name){if(name!=='mirror')stopMirror();if(name!=='alarm')stopAlarmRecording(false);baseOpenOSApp(name);if(name==='alarm')refreshAlarmUI();if(name==='mirror')setTimeout(startMirror,40)};
          closeOSApp=function(showDash=true){stopMirror();stopAlarmRecording(false);return baseCloseOSApp(showDash)};

          Object.assign(window,{saveAlarmTime,setAlarmEnabled,refreshAlarmUI,importAlarmSound,toggleAlarmRecording,stopAlarmRecording,clearAlarmSound,previewAlarmSound,dismissAlarm,snoozeAlarm,startMirror,stopMirror});
          refreshAlarmUI();startAlarmWatcher();
          })();
          </script>'''

          s = s.replace('</body>', addon + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Better OS Alarm and Mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Better OS alarm and camera mirror"
          git push
